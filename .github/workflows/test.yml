name: Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff actionlint-py
      - run: ruff check .
      - run: actionlint

  types:
    name: Types (pyright)
    runs-on: ubuntu-latest
    # Pyright is pinned: a newer version finds new things, and they are for
    # us to fix when we choose to move (change the pin and the code together).
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # the ``train`` extra (pylorenzmie) is needed for the checks of the
      # fits, the training and the evaluation, which import it
      - run: pip install -e ".[dev,train]" pyright==1.1.414
      - run: pyright

  docs:
    # Read the Docs builds with Python 3.12, without PyTorch (which
    # docs/conf.py mocks) and with warnings as errors; build the same way
    # here so that a failure shows up before the badge turns red
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  test:
    # macOS runners run the arm64 builds of the libraries (the platform CATCH
    # is developed on); they have no GPU, so the GPU path is not exercised
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1
      # the tests use random weights, except tests/test_shipped_models.py,
      # which loads the shipped ones; pylorenzmie (the ``train`` extra) is
      # for the tests of the fits, the training and the harness
      - name: Install package and test dependencies
        run: pip install -e ".[dev,train]"
      - name: Run tests with coverage
        run: python -m pytest --cov --tb=short -q

  minimum:
    # The lowest versions that pyproject.toml allows, on the oldest Python:
    # the pins are the lower bounds (tests/test_packaging.py checks that they
    # agree).  numpy 1.26 and torch 2.4 have no wheels beyond Python 3.12.
    name: Minimum versions (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1
      - name: Install the lowest versions of the dependencies
        run: >
          pip install -e ".[dev,train]"
          "numpy==1.26.*" "pandas==2.1.*" "pillow==10.0.*" "torch==2.4.*"
      - run: pip list
      - name: Run tests
        run: python -m pytest --tb=short -q
