[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catch-python"
version = "3.0.0"
description = "Characterizing And Tracking Colloids Holographically"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "David G. Grier", email = "david.grier@nyu.edu" },
]
keywords = [
    "holography", "microscopy", "Lorenz-Mie", "colloids",
    "machine learning", "particle tracking", "scientific",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10",
    "torch>=2.4",
]

[project.urls]
Homepage = "https://github.com/laltman2/CATCH"
Repository = "https://github.com/laltman2/CATCH"
"Bug Tracker" = "https://github.com/laltman2/CATCH/issues"

[project.optional-dependencies]
# fits of the Lorenz-Mie theory from the estimates (analyze(fit=True))
fit   = ["pylorenzmie>=3.9"]
# synthetic data, training and the evaluation harness
train = ["pylorenzmie>=3.9"]
dev   = ["pytest", "pytest-cov", "ruff"]
docs  = ["pydata-sphinx-theme", "sphinx", "sphinx-autodoc-typehints"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["CATCH*"]

[tool.setuptools.package-data]
"CATCH" = [
    "models/*/*/weights.pt",
    "models/*/*/configuration.json",
    "models/*/*/MODEL_CARD.md",
    "py.typed",
]
# the stored truth of the evaluation sets, which sets.verify compares with
"CATCH.customization.evaluation" = ["sets/*.csv"]

[tool.ruff]
line-length = 79
extend-exclude = ["devel"]

[tool.ruff.lint]
# F pyflakes, B bugbear, E501 line length, Q quotes, SIM simplifications
# (except SIM905), PERF performance, PIE misc, RUF012 mutable class
# attributes, RUF100 stale noqa, UP037 quoted annotations; E402 imports at
# the top, E731 lambda assigned, E741 ambiguous name, RUF015 first element,
# RUF059 unused unpacked variable, PLW0108 needless lambda, PLW1510
# subprocess without check, TID252 a relative import of a parent (a sibling
# is imported as `.name`), A001 and A002 a name that hides a builtin, C400
# and C401 a generator that is a comprehension, PLW2901 a loop variable that
# is overwritten.
select = ["F", "B", "E402", "E501", "E731", "E741", "Q", "SIM", "PERF",
          "PIE", "PLW0108", "PLW1510", "PLW2901", "RUF012", "RUF015",
          "RUF059", "RUF100", "TID252", "UP037", "A001", "A002", "C400",
          "C401"]
ignore = ["SIM905"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# Package files re-export names; tests build stubs and mocks.
"__init__.py" = ["F401"]
# Sphinx reads the name `copyright`.
"docs/conf.py" = ["A001", "E402"]
# Tests import after patching, unpack to name what they do not use, keep a
# temporary file open across a test, and are not held to the style rules
# that simplify code (a lambda in a test is often late binding on purpose,
# and a test runs a child process without a check).
"tests/*" = ["E402", "E501", "F401", "F811", "F841", "B018", "B905",
             "RUF012", "RUF059", "SIM", "PERF", "PIE", "PLW2901",
             "UP037", "PLW0108", "PLW1510", "E731", "RUF015", "A002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true

[tool.coverage.run]
source = ["CATCH"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/devel/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
# measured with the ``train`` extra installed (the tests of data generation
# skip without pylorenzmie), less a point
fail_under = 98

[tool.pyright]
# Type checking, as in QVideo and pylorenzmie; a CI job runs it with a pinned
# version.  It covers the library, the training, the harness and the tests.
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/devel"]
pythonVersion = "3.11"
reportPrivateImportUsage = "none"
