[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CATCH"
dynamic = ["version"]
description = "Characterizing And Tracking Colloids Holographically"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "David G. Grier", email = "david.grier@nyu.edu" },
]
keywords = [
    "holography", "microscopy", "Lorenz-Mie", "colloids",
    "machine learning", "particle tracking", "scientific",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "pandas",
    "opencv-python",
    "torch",
    "torchvision",
]

[project.urls]
Homepage = "https://github.com/laltman2/CATCH"
Repository = "https://github.com/laltman2/CATCH"
"Bug Tracker" = "https://github.com/laltman2/CATCH/issues"

[project.optional-dependencies]
# the Localizer needs YOLOv5, which this version of CATCH pins
yolo  = ["yolov5<=6.0.7", "packaging"]
# data generation and training
train = ["pylorenzmie>=3.7", "matplotlib"]
gpu   = ["cupy-cuda12x"]
wandb = ["wandb"]
dev   = ["pytest", "pytest-cov", "ruff"]
docs  = ["pydata-sphinx-theme", "sphinx", "sphinx-autodoc-typehints"]

[tool.setuptools]
packages = ["CATCH", "CATCH.evaluation", "CATCH.training",
            "CATCH.utilities"]

[tool.setuptools.package-dir]
"CATCH"           = "."
"CATCH.evaluation" = "evaluation"
"CATCH.training"  = "training"
"CATCH.utilities" = "utilities"

[tool.setuptools.package-data]
"CATCH" = [
    "cfg_estimator/*/weights.pt",
    "cfg_estimator/*/configuration.json",
    "cfg_yolov5/*/weights.pt",
]

# the one place where the version is written, until version.py goes away
[tool.setuptools.dynamic]
version = { attr = "CATCH.version.__version__" }

[tool.ruff]
line-length = 79
extend-exclude = ["devel"]

[tool.ruff.lint]
# The rule set of QVideo: F pyflakes, B bugbear, E501 line length, SIM
# simplifications, RUF012 mutable class attributes, PLW2901 overwritten loop
# variable, UP037 quoted annotations, PERF performance, PIE misc.  SIM905
# (split a literal string) is how the package writes its ``__all__``.
select = ["F", "B", "E501", "SIM", "RUF012", "PLW2901", "UP037", "PERF",
          "PIE"]
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true

[tool.coverage.run]
source = ["CATCH"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/devel/*",
    # The training scripts run for hours on a GPU (EstimatorTraining.py), or
    # call the training script of YOLOv5 (train_yolov5.py).
    "*/training/EstimatorTraining.py",
    "*/training/train_yolov5.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
# measured with the ``train`` extra installed (the tests of data generation
# skip without pylorenzmie), less a point
fail_under = 98

[tool.pyright]
# Type checking, as in QVideo and pylorenzmie; a CI job runs it with a pinned
# version.  It covers the library and the tests.  The training and
# data-generation scripts, ``utilities/`` and ``examples/`` are left out until
# they are rebuilt: they target an older pylorenzmie and have no annotations.
# The optional yolov5 package is typed by ``typings/yolov5``.
include = [
    "__init__.py", "CATCHapp.py", "Estimator.py", "Localizer.py",
    "ParamScale.py", "TorchEstimator.py", "instruments.py", "version.py",
    "evaluation", "training/synth.py",
    "tests",
]
exclude = ["**/__pycache__", "**/devel"]
pythonVersion = "3.11"
# the repository root is the package CATCH, so its parent holds the package
extraPaths = [".."]
reportPrivateImportUsage = "none"
# yolov5 is optional: its stub is in typings/, its source may be missing
reportMissingModuleSource = "none"
