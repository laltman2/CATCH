version: 2

build:
  os: ubuntu-24.04
  tools:
    python: '3.12'

# The documentation is built without PyTorch or YOLOv5 (docs/conf.py mocks
# them), so install only what Sphinx needs, not the package.
python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
